<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName __DOMAIN__
    DocumentRoot /var/www/photos
    # No directory listing: photo slugs stay secret.
    <Directory /var/www/photos>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
    # Photo files never change under the same name.
    <LocationMatch "^/p/">
        Header set Cache-Control "public, max-age=2592000, immutable"
    </LocationMatch>
    ErrorLog ${APACHE_LOG_DIR}/photos-error.log
    CustomLog ${APACHE_LOG_DIR}/photos-access.log combined
SSLCertificateFile /etc/letsencrypt/live/__DOMAIN__/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/__DOMAIN__/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
