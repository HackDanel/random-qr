# HTTP: only ACME challenges for certbot --webroot, everything else goes to HTTPS.
# "zz-" prefix sorts after existing sites, so the default vhosts stay the same.
<VirtualHost *:80>
    ServerName __DOMAIN__
    DocumentRoot /var/www/photos
    <Directory /var/www/photos>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/photos-error.log
    CustomLog ${APACHE_LOG_DIR}/photos-access.log combined
RewriteEngine on
RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
